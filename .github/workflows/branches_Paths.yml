name: Branch-Path
on:
  push:
    branches:
      - main
    paths:
      - 'Web-app/Backend/**'
      - 'Web-app/Frontend/**'
      - '!Web-app/documentation/**'
  
  workflow_dispatch:  
jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Staring phase
        run: echo "Pipeline Started Successfully"
      - name: Show Username
        run: uname -a
  job-2:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: echo "This is Test phase"
  job-3:
    runs-on: ubuntu-latest
    needs:
      - job-1
      - job-2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: list files
        run: ls -al
      - name: Pipeline Success
        run: echo "Pipeline Successfull"
        

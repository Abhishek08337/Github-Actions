name: step-output
on:
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: generate version
        id: version
        run: echo "version=1.0.0" >> "$GITHUB_OUTPUT"

      - name: show version
        run: 'echo "version is: ${{ steps.version.outputs.version }}"'
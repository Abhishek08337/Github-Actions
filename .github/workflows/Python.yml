name: Python CI
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependecies
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest

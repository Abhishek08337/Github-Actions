name: Path based triggers
on:
  push:
    paths:
      - 'Web-app/Backend/**'
      - 'Web-app/Frontend/**'
  # insted of path-ignore you can you ! in front '!Web-app/documentation/**'  like this
      - '!Web-app/documentation/**'

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Starting Pipeline
        run: echo "Running on paths and ignoring the paths"

      - name: Show username
        run: uname -a

  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: completion status
        run: echo "completed successfully"
